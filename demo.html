/* ==== дальше логика ==== */

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const LETTERS = "АБВГДЕ";
const MEM = {};
const store = { get: k => k in MEM ? MEM[k] : null, set: (k, v) => { MEM[k] = v; } };
const eliminated = key => { try { return JSON.parse(store.get("delo-out-" + key)) || []; } catch { return []; } };
function eliminate(key, decoy) {
  const out = eliminated(key);
  if (!out.includes(decoy)) store.set("delo-out-" + key, JSON.stringify(out.concat(decoy)));
}

const canStore = (() => { try { localStorage.setItem("delo-t", "1"); localStorage.removeItem("delo-t"); return true; } catch { return false; } })();
const solved = () => parseInt(store.get("delo-solved") || "0", 10) || 0;
const markSolved = n => { if (n > solved()) store.set("delo-solved", String(n)); };

  document.getElementById("pin").addEventListener("submit", e => {

    else document.getElementById("pin-msg").textContent = "Код не подошёл. Позовите доктора Ватсона.";
  });
}

function shell(tab, inner, stamp = "Секретно") {
  return `<div class="tab">${esc(tab)}</div><article class="sheet">${stamp ? `<div class="stamp">${esc(stamp)}</div>` : ""}${inner}</article>`;
}

function renderDecoy(id) {

  if (o) eliminate(s.key, id);
  app.innerHTML = shell("Ложный след", `
    <div class="meta"><span>Осмотр места: ${esc(d.place)}</span></div>
    <h1>Здесь пусто</h1>
    <p class="note">${esc(o ? o.card : "Шерлок, следствие сюда не направляло. Вернитесь к последней найденной улике и отсканируйте её QR ещё раз.")}</p>
    ${o ? `<a class="opt" id="back" href="#${s.key}"><span>Вернуться к показаниям</span></a>` : ""}`, "Ложный след");
  document.title = "Ложный след";
  window.scrollTo(0, 0);
}

function renderAuthor() {
  const real = STAGES.map((s, i) => ({ url: `${PUBLIC_URL}#${s.key}`, head: `QR № ${i + 1} · ${s.lies}`, name: s.title, sub: s.place ? `Ответ ведёт: ${s.place}` : "Финал: стоишь за спиной с феном" }));
  const fake = Object.values(DECOYS).map(d => ({ url: `${PUBLIC_URL}#${d.key}`, head: "Карточка ложного следа", name: d.place, sub: "Положить на это место" }));
  const row = x => `<li><div class="qr" data-url="${esc(x.url)}"></div><span class="small">${esc(x.head)}</span><strong>${esc(x.name)}</strong><span class="small">${esc(x.sub)}</span><a href="${esc(x.url)}">${esc(x.url)}</a></li>`;
  app.innerHTML = shell("Шпаргалка автора", `
    <div class="meta"><span>Только для тебя, не показывай Вике</span></div>
    <h1>Маршрут квеста</h1>
    <h2>Код Ватсона: ${WATSON_PIN}</h2>
    <p class="small">Открывает любую страницу, если QR отсканировали не по порядку или порядок сбился.</p>
    <h2>Конверт, вручаешь сам</h2>
    <p class="intro author-note">${esc(ENVELOPE)}</p>
    <h2>Этикетка на шоколадке</h2>
    <p class="intro">${esc(CHOCOLATE_LABEL)}</p>
    <h2>Бирка на наушниках</h2>
    <p class="intro">${esc(HEADPHONES_TAG)}</p>
    <h2>QR на подарках</h2>
    <ul class="list">${real.map(row).join("")}</ul>
    <h2>Карточки ложных следов</h2>
    <ul class="list">${fake.map(row).join("")}</ul>`, "");
  if (window.QRCode) document.querySelectorAll(".qr").forEach(el => new QRCode(el, { text: el.dataset.url, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M }));
  document.title = "Шпаргалка автора";
}

function renderStage(idx) {
  if (GATE && canStore && idx > solved()) return renderWeb(idx);
  const s = STAGES[idx];
  store.set("delo-current", s.key);
  const out = eliminated(s.key);
  const dots = STAGES.map((_, i) => `<i class="${i <= idx ? "on" : ""}"></i>`).join("");
  app.innerHTML = shell(CASE, `
    <div class="meta"><span>Протокол № ${idx + 2}</span><span class="dots" aria-hidden="true">${dots}</span></div>
    <h1>${esc(s.title)}</h1>
    ${s.prize ? `<div class="exhibit"><span class="lbl">${esc(s.prize[0])}</span><span>${esc(s.prize[1])}</span></div>` : ""}
    ${s.intro ? `<div class="intro">${s.intro.map(p => `<p>${esc(p)}</p>`).join("")}<p class="sig">${esc(s.introSign)}</p></div>` : ""}
    <div class="story">
      ${s.lead ? `<p>${esc(s.lead)}</p>` : ""}
      ${s.story ? s.story.map(p => `<p>${esc(p)}</p>`).join("") : ""}
    </div>
    ${s.witnesses ? `<ul class="witnesses">${s.witnesses.map(w => `<li><span class="who">${esc(w[0])}</span><span>${esc(w[1])}</span></li>`).join("")}</ul>` : ""}
    <p class="q">${esc(s.question)}</p>
    <div class="opts" id="opts">${s.options.map((o, i) => {
      const gone = o.decoy && out.includes(o.decoy);
      return `<button class="opt${gone ? " wrong" : ""}" type="button" id="opt-${i}" data-i="${i}"${gone ? " disabled" : ""}><b>${LETTERS[i]}</b><span>${esc(o.text)}</span></button>`;
    }).join("")}
    </div>
    <div id="out"></div>`);
  document.title = `Протокол № ${idx + 2} · ${s.title}`;
  window.scrollTo(0, 0);

  const box = document.getElementById("out");
  document.getElementById("opts").addEventListener("click", e => {
    const btn = e.target.closest(".opt");
    if (!btn || btn.disabled) return;
    const o = s.options[+btn.dataset.i];
    if (s.final) {
      if (o.right) {
        document.querySelectorAll(".opt").forEach(b => b.disabled = true);
        btn.classList.add("right");
        box.innerHTML = finalHtml(s);
      } else {
        btn.classList.add("wrong");
        btn.disabled = true;
        box.innerHTML = `<p class="note">${esc(o.hint)}</p>`;
      }
    } else {
      document.querySelectorAll(".opt").forEach(b => b.disabled = true);
      btn.classList.add("picked");
      if (o.right) { markSolved(idx + 1); store.set("delo-picked", ""); } else store.set("delo-picked", o.decoy);
      const place = o.right ? s.place : DECOYS[o.decoy].place;
      box.innerHTML = `
        <section class="found">
          <div class="verdict">Принято</div>
          <span class="lbl">Версия следствия</span>
          <p class="place">${esc(place)}</p>
          <p>Осмотрите место и найдите QR-код. Только там станет ясно, права ли версия.</p>
          <button class="opt" type="button" data-go="${o.right ? STAGES[idx + 1].key : DECOYS[o.decoy].key}"><span>Демо: дойти до этого места и отсканировать QR</span></button>
        </section>`;
    }
    box.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
  });
}

function finalHtml(s) {
  return `<section class="found">
    <div class="verdict">Раскрыто</div>
    <span class="lbl">Заключение следствия</span>
    <div class="letter">${s.final.map(p => `<p>${esc(p)}</p>`).join("")}<p class="sign">${esc(s.sign)}</p></div>
  </section>`;
}

let H = "";
function renderMenu() {
  const row = (k, a, b) => `<button class="opt" type="button" data-go="${k}"><span><strong>${esc(a)}</strong><br><span class="small">${esc(b)}</span></span></button>`;
  app.innerHTML = shell("Демо для автора", `
    <div class="meta"><span>Вика этого экрана не увидит</span></div>
    <h1>Весь квест</h1>
    <p class="story">Начни с первого протокола и выбирай ответы. После ответа нажимай кнопку «дойти до места»: она заменяет реальный поход и сканирование QR.</p>
    <p class="intro author-note"><b>Конверт, с него всё начинается:</b>\n${esc(ENVELOPE)}</p>
    <h2>Страницы по порядку</h2>
    <div class="opts">${STAGES.map((s, i) => row(s.key, `Протокол № ${i + 2}. ${s.title}`, s.lies)).join("")}</div>
    <h2>Если отсканирует раньше времени</h2>
    <div class="opts">${row("ranniy", "Экран «Нити не сходятся»", "Код Ватсона: " + WATSON_PIN)}</div>
    <h2>Шпаргалка</h2>
    <div class="opts">${row(AUTHOR_KEY, "QR-коды и тексты для печати", "Все 10 кодов")}</div>`, "Демо");
  document.title = "Демо дела Ватсона";
}
function route() {
  const h = H;
  const decoy = Object.keys(DECOYS).find(id => DECOYS[id].key === h);
  const idx = STAGES.findIndex(s => s.key === h);
  if (h === AUTHOR_KEY) renderAuthor();
  else if (h === "ranniy") renderWeb(2);
  else if (decoy) renderDecoy(decoy);
  else if (idx >= 0) renderStage(idx);
  else return renderMenu();
  app.insertAdjacentHTML("afterbegin", `<p style="margin:0 0 14px"><button style="font:13px var(--f-type);padding:10px 14px;background:var(--paper);color:var(--ink);border:0;border-radius:3px;cursor:pointer" type="button" data-go=""><span>К списку всех страниц</span></button></p>`);
}
function go(k) { H = k; route(); window.scrollTo(0, 0); }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (b) return go(b.dataset.go);
  const a = e.target.closest('a[href^="#"]');
  if (a) { e.preventDefault(); go(a.getAttribute("href").slice(1)); }
});
route();
</script>
</body></html>
